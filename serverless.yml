org: jeanarana
service: rotacion-alumnos-rds

provider:
  name: aws
  runtime: python3.13
  region: us-east-1
  memorySize: 1024
  timeout: 60
  iam:
    role: arn:aws:iam::028825348944:role/LabRole

functions:
  rotar:
    handler: RotarSecretos.lambda_handler
    events:
      - schedule: rate(10 minutes)
